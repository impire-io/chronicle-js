name: release

# A v* tag is a release (decision 0040, after 0017): the gate and the
# conformance suite of the declared contract version run again, then the
# package is published to npm with provenance. Publishing is npm trusted
# publishing: npm trusts this workflow of impire-io/chronicle-js through
# GitHub's OIDC token (id-token: write), so no npm token is stored here.
# Trusted publishing needs npm 11.5.1 or later.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: An npm that speaks trusted publishing
        run: npm install -g npm@11 && npm --version

      - run: npm ci

      - name: The tag is the package version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"

      - name: Gate
        run: make lint test build

      - name: Publish
        run: npm publish --access public --provenance
