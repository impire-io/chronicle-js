name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: The generated contract module matches the artifact
        run: |
          npm run generate
          git diff --exit-code -- src/generated/

      - name: Lint (eslint, tsc, prettier)
        run: make lint

      - name: Fetch the chronicle release the suite comes from
        run: make release-fetch

      # Unit tests and the conformance suite of the declared version, against
      # the chronicle release's own `chronicle up` over its websocket — no
      # mocked NATS (design 12 § the conformance suite).
      - name: Test
        run: npx vitest run --reporter=default --reporter=json --outputFile.json=.chronicle/conformance.json

      - name: The support matrix is rendered from the result
        run: |
          node scripts/matrix.mjs .chronicle/conformance.json
          git diff --exit-code -- README.md

      - name: Build
        run: make build

  # Contributions are accepted under the Developer Certificate of Origin
  # (decision 0040): every commit a pull request brings carries the
  # author's Signed-off-by trailer.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          missing=0
          for sha in $(git rev-list "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "no Signed-off-by on $(git log -1 --format='%h %s' "$sha")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "add the trailer with: git commit -s (see CONTRIBUTING.md)"
            exit 1
          fi
